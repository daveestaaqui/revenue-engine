name = "surplusdocket-morning-sentinel"
main = "worker.js"
compatibility_date = "2024-09-01"

# Scheduled Cron Triggers (UTC)
# Mon-Fri:
# 11:00 UTC = 7:00 AM EDT (DST)
# 11:15 UTC = 7:15 AM EDT (DST)
# 11:30 UTC = 7:30 AM EDT (DST)
# 12:00 UTC = 7:00 AM EST (Standard) / 8:00 AM EDT
# 12:15 UTC = 7:15 AM EST (Standard) / 8:15 AM EDT
# 12:30 UTC = 7:30 AM EST (Standard) / 8:30 AM EDT
[triggers]
crons = [
  "0 11 * * 1-5",
  "15 11 * * 1-5",
  "30 11 * * 1-5",
  "0 12 * * 1-5",
  "15 12 * * 1-5",
  "30 12 * * 1-5"
]

# Set the following secrets via `npx wrangler secret put`:
# - GITHUB_TOKEN: A GitHub Personal Access Token (classic with 'repo' scope or fine-grained with Actions write)
# - SECRET_KEY: Optional bearer token for the /trigger HTTP endpoint
