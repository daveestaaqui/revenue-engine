<svg xmlns="http://www.w3.org/2000/svg" width="280" height="56" viewBox="0 0 280 56" fill="none">
  <defs>
    <linearGradient id="sd-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="sd-shadow" x="-4%" y="-8%" width="108%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="278" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sd-shadow)"/>
  <!-- Official Judicial Scales & Shield Logo Emblem -->
  <g transform="translate(12, 10)">
    <rect width="36" height="36" rx="8" fill="#1b365d"/>
    <!-- Outer Crest Border -->
    <path d="M18 5 L9 9 V18 C9 24 13 29 18 31 C23 29 27 24 27 18 V9 L18 5 Z" stroke="#4c6d48" stroke-width="1.5" fill="#102238"/>
    <!-- Central Pillar / Fulcrum -->
    <path d="M18 10 V23 M15 23 H21" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crossbeam Balance -->
    <path d="M12 13.5 H24" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left Scale Pan -->
    <path d="M12 13.5 L10 18 M12 13.5 L14 18" stroke="#38bdf8" stroke-width="1"/>
    <path d="M9 18 Q12 21 15 18 Z" fill="#38bdf8" fill-opacity="0.8"/>
    <!-- Right Scale Pan -->
    <path d="M24 13.5 L22 18 M24 13.5 L26 18" stroke="#38bdf8" stroke-width="1"/>
    <path d="M21 18 Q24 21 27 18 Z" fill="#38bdf8" fill-opacity="0.8"/>
  </g>
  <!-- Text -->
  <text x="54" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.02em">SURPLUS DOCKET</text>
  <text x="54" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">Verified Court Registry Feeds</text>
  <circle cx="258" cy="28" r="4" fill="#10b981"/>
  <circle cx="258" cy="28" r="7" fill="#10b981" fill-opacity="0.2"/>
</svg>