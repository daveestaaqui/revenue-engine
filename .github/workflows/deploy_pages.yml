name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_run:
    workflows:
      - "Daily Autonomous Revenue Pipeline"
      - "Manage Subscribers"
      - "Autonomous Bug Resolver & Self-Healing Sentinel"
      - "Automated Content Syndication & Backlink Engine"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
