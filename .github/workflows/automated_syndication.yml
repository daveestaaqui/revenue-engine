name: Autonomous Link Building, Directory Submissions & Syndication

on:
  schedule:
    # Runs Monday, Wednesday & Friday at 15:00 UTC (11:00 AM EST)
    - cron: '0 15 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run preview mode (no live network requests or emails)'
        type: boolean
        default: false
      directory_limit:
        description: 'Number of high-DA directories to process (default: 8)'
        required: false
        default: '8'
      outreach_limit:
        description: 'Number of outreach targets (clinics, bar LPMs, bloggers) to pitch (default: 6)'
        required: false
        default: '6'
      channel:
        description: 'Select execution channel: both, directories, or outreach'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - directories
          - outreach

permissions:
  contents: write

concurrency:
  group: automated-syndication
  cancel-in-progress: false

jobs:
  run-linkbuilding-and-syndication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 1. Generate Latest RSS Feeds & Syndication Articles
        run: |
          python scripts/generate_rss_feed.py
          python marketing/link_building/syndication_publisher.py

      - name: 2. Refresh High-DA Directory Citations & Promotion Packets
        run: |
          python marketing/link_building/directory_citations.py
          python marketing/link_building/embed_promoter.py

      - name: 3. Autonomous Directory Submissions (Lawyerist, FindLaw, Justia, Capterra, G2, etc.)
        if: github.event.inputs.channel == 'both' || github.event.inputs.channel == 'directories' || github.event.inputs.channel == ''
        run: |
          DIR_LIMIT="${{ github.event.inputs.directory_limit || 8 }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python marketing/link_building/auto_directory_submitter.py --dry-run --limit "$DIR_LIMIT"
          else
            python marketing/link_building/auto_directory_submitter.py --live --limit "$DIR_LIMIT" || true
          fi

      - name: 4. Autonomous Tool Link & Embed Outreach (Law Clinics, Bar LPMs, Tech Bloggers)
        if: github.event.inputs.channel == 'both' || github.event.inputs.channel == 'outreach' || github.event.inputs.channel == ''
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          TOOL_OUTREACH_FROM_NAME: ${{ vars.TOOL_OUTREACH_FROM_NAME || 'Elena Brooks' }}
          TOOL_OUTREACH_FROM_EMAIL: ${{ vars.TOOL_OUTREACH_FROM_EMAIL || 'elena.brooks@surplusdocket.com' }}
          TOOL_OUTREACH_REPLY_TO: ${{ vars.TOOL_OUTREACH_REPLY_TO || 'elena.brooks@surplusdocket.com' }}
        run: |
          OUTREACH_LIMIT="${{ github.event.inputs.outreach_limit || 6 }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "$GMAIL_APP_PASS" ]; then
            echo "🛡️ Zero-Spam Protection / Dry-Run Mode: Generating outreach drafts and updating target log..."
            python marketing/link_building/tool_outreach_engine.py --dry-run --limit "$OUTREACH_LIMIT"
          else
            echo "🚀 Live Outreach Mode: Dispatching authenticated pitches via SMTP..."
            python marketing/link_building/tool_outreach_engine.py --live --limit "$OUTREACH_LIMIT" || true
          fi

      - name: 5. Generate Digital PR Pitches
        run: |
          python marketing/link_building/pr_pitcher.py

      - name: 6. Generate County Clerk & Legal Aid Educational Letters
        run: |
          python marketing/link_building/clerk_outreach_generator.py

      - name: 7. Execute Article Submissions, IndexNow & Search Engine Indexing
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY || secrets.DEVTO_API_KEY }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
          SYNDICATION_WEBHOOK_URL: ${{ secrets.SYNDICATION_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python marketing/link_building/auto_article_submitter.py --dry-run
          else
            python marketing/link_building/auto_article_submitter.py
          fi

      - name: 8. Commit & Push Updated Submission Logs, Citations, Targets & Syndications
        run: |
          git config --global user.name "Surplus Docket Link Building Bot"
          git config --global user.email "bot@surplusdocket.com"
          git add site/feed.xml site/rss.xml marketing/syndicate/ marketing/link_building/ marketing/pitches/ marketing/clerk_outreach/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(linkbuilding): autonomous directory submissions & tool outreach [skip ci]"
            git checkout -- . || true
            git clean -fd || true
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "Retry push $attempt..."; sleep 5; }
            done
          fi

      - name: 9. Upload Link Building & Syndication Registry Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-building-and-syndication-artifacts
          path: |
            marketing/link_building/submission_registry.json
            marketing/link_building/tool_outreach_log.csv
            marketing/link_building/submission_artifacts/
            marketing/link_building/outreach_drafts/
          retention-days: 30
