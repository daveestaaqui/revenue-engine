name: Daily Autonomous Revenue Pipeline

on:
  schedule:
    # Runs daily overnight at 04:15 UTC (12:15 AM EDT / 11:15 PM EST)
    # Guarantees B2B data generation, cryptographic vault, and manifest verification
    # complete well before the 7:00 AM ET morning subscriber dispatch.
    - cron: '15 4 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI

permissions:
  contents: write

concurrency:
  group: daily-revenue-pipeline
  cancel-in-progress: false

jobs:
  run-revenue-engines:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Run Statutory Compliance & Legal Rule Sentinel
        run: |
          python compliance/statute_monitor.py

      - name: 1b. Run Autonomous Pre-Flight Self-Healer & Site Sentinel
        run: |
          python compliance/autonomous_bug_resolver.py --self-repair --dry-run || true
          python portal/pipeline_self_healer.py --audit-all || true

      - name: 1c. Autonomous Stripe Subscriber & Trial Intake
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          python portal/sync_stripe_subscribers.py || echo "Stripe sync note: continuing..."

      - name: 2. Generate B2B Surplus Data Feeds (6-State National Suite)
        run: |
          python portal/feed_generator.py

      - name: 3. Synchronize Verified Outreach Drafts in Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          FROM_NAME: 'David Mahler'
          FROM_EMAIL: 'david@surplusdocket.com'
          REPLY_TO: 'david@surplusdocket.com'
        run: |
          if [ -n "$GMAIL_APP_PASS" ]; then
            python outreach/update_verified_gmail_drafts.py || echo "Draft update note: continuing..."
          fi

      - name: 4. Generate Programmatic County SEO Landing Pages
        run: |
          python marketing/county_generator.py

      - name: 5. Run Autonomous Legal Blog & Content Engine
        run: |
          python marketing/blog_generator.py

      - name: 6. Run Autonomous Press Release & Newsroom Engine
        run: |
          python marketing/press_release_generator.py

      - name: 7. Run Automated SEO & RSS Syndication Engine
        run: |
          python marketing/seo_generator.py

      - name: 8. Run Social & Legal Syndication Engine
        run: |
          python marketing/social_syndicator.py

      - name: 9. Update Dynamic Repository Showcase & Verification Manifest
        run: |
          python marketing/readme_updater.py
          python compliance/verify_all_publications.py

      - name: 10. Commit & Push Updated Feeds, Blog Posts, REST API, Compliance & Subscribers
        run: |
          git config --global user.name "Surplus Docket Bot"
          git config --global user.email "bot@surplusdocket.com"
          git add README.md data/ exports/ site/ marketing/syndicate/ compliance/ portal/subscribers.json portal/processed_stripe_events.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): daily B2B surplus feeds, REST API, compliance, PRs, SEO & strategy refresh"
            git checkout -- . || true
            git clean -fd || true
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break || { git rebase --abort 2>/dev/null || true; echo "Retry push $attempt..."; sleep 5; }
            done
          fi

      - name: 11. Pre-Compile & Verify Morning Feed Health
        run: |
          python portal/dispatch_morning_feed.py --dry-run

      - name: 12. Upload Delivery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-revenue-deliverables
          path: |
            exports/
          retention-days: 30

