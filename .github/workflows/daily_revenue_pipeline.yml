name: Daily Autonomous Revenue Pipeline

on:
  schedule:
    # Runs daily at 11:00 UTC (7:00 AM EST) — before US business hours
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI

permissions:
  contents: write

jobs:
  run-revenue-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests pypdf beautifulsoup4

      - name: 1. Generate B2B Surplus Data Feeds (FL & TX)
        run: |
          python portal/feed_generator.py

      - name: 2. Run Expired Domain Arbitrage Scanner
        run: |
          python domain_arbitrage/run_domain_pipeline.py

      - name: 3. Commit & Push Updated Data Feeds to Repo (Subscribers Auto-Update)
        run: |
          git config --global user.name "Revenue Engine Bot"
          git config --global user.email "bot@revenue-engine.internal"
          git add exports/*.csv exports/*.xlsx exports/*.json domain_arbitrage/listings/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily B2B surplus feeds & domain arbitrage update [skip ci]" && git push)

      - name: 4. Upload Delivery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-revenue-deliverables
          path: |
            exports/
            domain_arbitrage/listings/
          retention-days: 30
