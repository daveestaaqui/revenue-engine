name: Daily Autonomous Revenue Pipeline

on:
  schedule:
    # Runs daily at 11:00 UTC (7:00 AM EST) — before US business hours
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI

permissions:
  contents: write

jobs:
  run-revenue-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Generate B2B Surplus Data Feeds (FL & TX)
        run: |
          python portal/feed_generator.py

      - name: 2. Run Expired Domain Arbitrage Scanner
        run: |
          python domain_arbitrage/run_domain_pipeline.py

      - name: 3. Run Autonomous Legal Blog & Content Engine
        run: |
          python marketing/blog_generator.py

      - name: 4. Run Automated SEO & RSS Syndication Engine
        run: |
          python marketing/seo_generator.py

      - name: 5. Commit & Push Updated Feeds, Blog Posts, REST API & SEO Sitemaps
        run: |
          git config --global user.name "Surplus Docket Bot"
          git config --global user.email "bot@surplusdocket.com"
          git add exports/ site/api/ site/blog/ site/feed.xml site/sitemap.xml domain_arbitrage/listings/ marketing/syndicate/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily B2B surplus feeds, REST API, blog & SEO refresh [skip ci]" && git push)

      - name: 6. Upload Delivery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-revenue-deliverables
          path: |
            exports/
            domain_arbitrage/listings/
          retention-days: 30
