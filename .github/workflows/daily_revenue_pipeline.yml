name: Daily Autonomous Revenue Pipeline

on:
  schedule:
    # Runs daily at 11:00 UTC (7:00 AM EST) — before US business hours
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI

permissions:
  contents: write

jobs:
  run-revenue-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Run Statutory Compliance & Legal Rule Sentinel
        run: |
          python compliance/statute_monitor.py

      - name: 2. Generate B2B Surplus Data Feeds (FL, TX & GA)
        run: |
          python portal/feed_generator.py

      - name: 3. Run Expired Domain Arbitrage Scanner
        run: |
          python domain_arbitrage/run_domain_pipeline.py

      - name: 4. Generate Programmatic County SEO Landing Pages
        run: |
          python marketing/county_generator.py

      - name: 5. Run Autonomous Legal Blog & Content Engine
        run: |
          python marketing/blog_generator.py

      - name: 6. Run Autonomous Press Release & Newsroom Engine
        run: |
          python marketing/press_release_generator.py

      - name: 7. Run Automated SEO & RSS Syndication Engine
        run: |
          python marketing/seo_generator.py

      - name: 8. Run Social & Legal Syndication Engine
        run: |
          python marketing/social_syndicator.py

      - name: 9. Update Dynamic Repository Showcase
        run: |
          python marketing/readme_updater.py

      - name: 10. Commit & Push Updated Feeds, Blog Posts, REST API, Compliance & Syndications
        run: |
          git config --global user.name "Surplus Docket Bot"
          git config --global user.email "bot@surplusdocket.com"
          git add README.md exports/ site/ domain_arbitrage/listings/ marketing/syndicate/ compliance/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily B2B surplus feeds, REST API, compliance, PRs & SEO refresh" && git pull --rebase origin main && git push)

      - name: 11. Dispatch 7:00 AM EST Morning Feed to Active Subscribers
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          FROM_EMAIL: 'elena.brooks@surplusdocket.com'
          FROM_NAME: 'Elena Brooks | Surplus Docket'
        run: |
          if [ -n "$GMAIL_APP_PASS" ]; then
            python portal/dispatch_morning_feed.py --send
          else
            echo "GMAIL_APP_PASS secret not set; running dry-run preview."
            python portal/dispatch_morning_feed.py --dry-run
          fi

      - name: 12. Upload Delivery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-revenue-deliverables
          path: |
            exports/
            domain_arbitrage/listings/
          retention-days: 30

