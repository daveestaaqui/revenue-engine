name: Surplus Docket Inbound Sentinel & Autonomous Draft Creator

on:
  schedule:
    # Runs continually every 10 minutes 24/7 across business and off-hours
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      auto_send:
        description: 'Auto-send replies via SMTP instead of staging Gmail drafts (default: true)'
        type: boolean
        default: true
      dry_run:
        description: 'Dry run check without creating drafts or sending'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: elena-inbox-sentinel
  cancel-in-progress: false

jobs:
  monitor-inbox-and-draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Inbound Inbox Scan & Draft Creator
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          AUTO_SEND: ${{ (inputs.auto_send == false) && 'false' || secrets.AUTO_SEND || 'true' }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          FROM_NAME: 'David Mahler'
          SENDER_EMAIL: 'david@surplusdocket.com'
          REPLY_TO: 'david@surplusdocket.com'
        run: |
          if [ -z "$GMAIL_APP_PASS" ]; then
            echo "ℹ️ GMAIL_APP_PASS secret not configured in repository. Skipping IMAP pass."
            exit 0
          fi
          CMD_ARGS="--single-pass"
          if [ "${{ inputs.auto_send }}" != "true" ] && [ "${AUTO_SEND}" != "true" ]; then
            CMD_ARGS="$CMD_ARGS --drafts-only"
          fi
          echo "Running inbox scan with args: $CMD_ARGS (AUTO_SEND=${AUTO_SEND})"
          python outreach/auto_responder_and_draft_cleaner.py $CMD_ARGS
          python portal/sync_stripe_subscribers.py

      - name: 7:00 AM EST Morning Court Feed Autonomous Failover Check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          FROM_EMAIL: 'dockets@surplusdocket.com'
          FROM_NAME: 'Surplus Docket Intelligence'
        run: |
          if [ -n "$GMAIL_APP_PASS" ]; then
            git pull --rebase origin main || git rebase --abort 2>/dev/null || true
            # Executes failover sentinel; safely dispatches via portal/dispatch_morning_feed.py only if inside morning window
            python portal/sentinel_morning_failover.py
          fi

      - name: Commit & Push Updated Logs & Tracking
        run: |
          git config --global user.name "Surplus Docket Bot"
          git config --global user.email "bot@surplusdocket.com"
          for f in data/notable_email_activity.json outreach/bounced_emails.json outreach/sent_log.csv outreach/high_conviction_attorneys.csv outreach/verified_pool.json outreach/created_drafts_log.json outreach/unsubscribed_urls.json outreach/auto_responder.log marketing/link_building/tool_outreach_targets.csv portal/subscribers.json site/api/v1/auth_registry.json portal/processed_stripe_events.json portal/daily_dispatch_log.json portal/trial_lifecycle_log.json; do if [ -f "$f" ]; then git add "$f"; fi; done

          if ! git diff --staged --quiet; then
            git commit -m "chore(inbox): updated auto-responses & notable activity [skip ci]"
            git checkout -- . || true
            git clean -fd || true
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break || { git rebase --abort 2>/dev/null || true; echo "Retry push $attempt..."; sleep 5; }
            done
          fi

      - name: Archive Sentinel Logs Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-sentinel-log
          path: outreach/auto_responder.log
          retention-days: 14
