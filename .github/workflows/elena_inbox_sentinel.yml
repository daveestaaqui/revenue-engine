name: Surplus Docket Inbound Sentinel & Auto-Responder Engine

on:
  schedule:
    # Runs every 15 minutes 24/7 in GitHub Actions
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run check without creating drafts or auto-sending'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor-inbox-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Inbound Inbox Scan & Auto-Responder Pass
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          FROM_NAME: 'Surplus Docket Intelligence'
          SENDER_EMAIL: 'dockets@surplusdocket.com'
          REPLY_TO: 'dockets@surplusdocket.com'
        run: |
          if [ -z "$GMAIL_APP_PASS" ]; then
            echo "ℹ️ GMAIL_APP_PASS secret not configured in repository. Skipping IMAP pass."
            exit 0
          fi
          python outreach/auto_responder_and_draft_cleaner.py --single-pass
          python portal/sync_stripe_subscribers.py

      - name: Commit & Push Updated Logs & Tracking
        run: |
          git config --global user.name "Surplus Docket Bot"
          git config --global user.email "bot@surplusdocket.com"
          for f in data/notable_email_activity.json outreach/created_drafts_log.json outreach/unsubscribed_urls.json outreach/auto_responder.log portal/subscribers.json portal/processed_stripe_events.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(inbox): updated auto-responses & notable activity [skip ci]" && git pull --rebase origin main && git push)

      - name: Archive Sentinel Logs Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elena-sentinel-log
          path: outreach/auto_responder.log
          retention-days: 14
