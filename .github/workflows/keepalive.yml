name: Repository Keepalive

on:
  schedule:
    # Run weekly on Sunday at midnight UTC to prevent GitHub from
    # disabling scheduled workflows due to repository inactivity.
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keepalive Commit
        run: |
          git config --global user.name "Surplus Docket Bot"
          git config --global user.email "bot@surplusdocket.com"
          echo "Last keepalive: $(date -u)" > .github/.keepalive
          git add .github/.keepalive
          if ! git diff --staged --quiet; then
            git commit -m "chore: weekly keepalive to prevent workflow disablement [skip ci]"
            git push
          fi
