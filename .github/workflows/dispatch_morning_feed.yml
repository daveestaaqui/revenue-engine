name: Dispatch 7:00 AM EST Morning Court Intelligence Feed

on:
  schedule:
    # Staging triggers: wake runner 5 minutes before 7:00 AM Eastern Time at minute :55
    # (Off-peak minute avoids GitHub Actions queue delay so runner boots and preps dependencies)
    # EDT (UTC-4): 6:55 AM EDT = 10:55 UTC
    - cron: '55 10 * * 1-5'
    # EST (UTC-5): 6:55 AM EST = 11:55 UTC
    - cron: '55 11 * * 1-5'
    # Standard top-of-hour schedules (preserved for compatibility)
    # Daylight Saving Time (EDT = UTC-4): 7:00 AM EDT = 11:00 UTC
    - cron: '0 11 * * 1-5'
    # Standard Time (EST = UTC-5): 7:00 AM EST = 12:00 UTC
    - cron: '0 12 * * 1-5'
  repository_dispatch:
    types: [dispatch_morning_feed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force live dispatch even if already dispatched today'
        type: boolean
        default: false
      dry_run:
        description: 'Run in dry-run preview mode (no emails transmitted)'
        type: boolean
        default: false
      recipient:
        description: 'Optional single recipient email override for testing'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: dispatch-morning-feed-primary
  cancel-in-progress: true


jobs:
  dispatch-morning-feed:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      FROM_EMAIL: 'dockets@surplusdocket.com'
      FROM_NAME: 'Surplus Docket Intelligence'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronize Active Stripe Subscribers
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          python portal/sync_stripe_subscribers.py || echo "Stripe sync note: continuing..."

      - name: Synchronize to 7:00:00 AM EST Sharp
        run: |
          python -c "
          import time, datetime
          from zoneinfo import ZoneInfo
          now_et = datetime.datetime.now(ZoneInfo('America/New_York'))
          print(f'Current Eastern Time: {now_et.strftime(\"%A %I:%M:%S %p %Z\")}')
          # If runner initialized during the 6:55 - 6:59 AM staging window, wait until 7:00:00 AM sharp
          if now_et.hour == 6 and now_et.minute >= 55:
              target_et = now_et.replace(hour=7, minute=0, second=0, microsecond=0)
              wait_sec = (target_et - now_et).total_seconds()
              if 0 < wait_sec <= 360:
                  print(f'Staged early at {now_et.strftime(\"%I:%M:%S %p\")}. Countdown to 7:00:00 AM EST sharp ({wait_sec:.1f}s)...')
                  time.sleep(wait_sec)
                  print('Target 7:00:00 AM EST reached. Dispatching immediately!')
          "

      - name: Dispatch Verified Morning Intelligence Feed to Subscribers
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.recipient }}" ]; then
            ARGS="$ARGS --recipient ${{ github.event.inputs.recipient }}"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "$GMAIL_APP_PASS" ]; then
            echo "Running in preview / dry-run mode..."
            python portal/dispatch_morning_feed.py --dry-run $ARGS
          else
            echo "Running live morning feed dispatch to active subscribers..."
            python portal/dispatch_morning_feed.py --send $ARGS
          fi

      - name: Run Institutional 7-Day Trial Retention Sentinel (Day 3 & Day 6)
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "$GMAIL_APP_PASS" ]; then
            python portal/trial_retention_sentinel.py --dry-run
          else
            python portal/trial_retention_sentinel.py --send
          fi

      - name: Commit Dispatch & Retention Logs (Idempotent Ledgers)
        run: |
          git config --global user.name "Surplus Docket Bot"
          git config --global user.email "bot@surplusdocket.com"
          for f in portal/daily_dispatch_log.json portal/trial_lifecycle_log.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore(feed): update morning dispatch and trial retention logs [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "Retry push $attempt..."; sleep 5; }
            done
          fi
