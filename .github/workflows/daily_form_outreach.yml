name: Daily Autonomous Legal Form Outreach

on:
  schedule:
    # Morning Batch: Monday through Friday at 14:00 UTC (10:00 AM EST / 7:00 AM PST) — 12 messages
    - cron: '0 14 * * 1-5'
    # Afternoon Batch: Monday through Friday at 18:00 UTC (2:00 PM EST / 11:00 AM PST) — 12 messages
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of law firms to contact per run (12/run x 2 runs = 24 messages/day)'
        required: false
        default: '12'
      dry_run:
        description: 'Run in dry-run preview mode (no live submission)'
        type: boolean
        default: false

concurrency:
  group: outreach-production-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-form-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Headless Chromium
        run: |
          playwright install --with-deps chromium

      - name: Execute Automated Legal Outreach Batch
        env:
          BATCH_LIMIT: ${{ inputs.limit || '12' }}
        run: |
          LIMIT="$BATCH_LIMIT"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python outreach/form_outreach_engine.py --dry-run --limit="$LIMIT"
          else
            python outreach/form_outreach_engine.py --limit="$LIMIT"
          fi

      - name: Commit & Push Updated Submission Logs & Screenshots
        if: always() && github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: |
          git config --global user.name "Surplus Docket Outreach Bot"
          git config --global user.email "outreach@surplusdocket.com"
          for f in outreach/form_submissions_log.csv outreach/form_screenshots/; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(outreach): recorded daily law firm contact form submissions [skip ci]" && git pull --rebase origin main && git push)

      - name: Upload Screenshot Proof Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outreach-submission-proofs
          path: |
            outreach/form_screenshots/
            outreach/preview_artifacts/
          retention-days: 30
