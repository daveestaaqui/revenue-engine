name: Daily Autonomous Legal Outreach

on:
  schedule:
    # Morning Batch: Monday through Friday at 14:00 UTC (10:00 AM EST / 7:00 AM PST) — 12 messages
    - cron: '0 14 * * 1-5'
    # Afternoon Batch: Monday through Friday at 18:00 UTC (2:00 PM EST / 11:00 AM PST) — 12 messages
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of law firms to contact per run (default: 12)'
        required: false
        default: '12'
      dry_run:
        description: 'Run in dry-run preview mode (no live submission/email send)'
        type: boolean
        default: false
      channel:
        description: 'Channel to execute: email (SMTP), forms (Playwright), or both'
        required: false
        default: 'email'
        type: choice
        options:
          - email
          - forms
          - both

concurrency:
  group: outreach-production-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Headless Chromium (if forms channel selected)
        if: inputs.channel == 'forms' || inputs.channel == 'both'
        run: |
          playwright install --with-deps chromium

      - name: Execute Automated Direct Email Outreach (SMTP Draft Dispatcher)
        if: github.event_name == 'schedule' || inputs.channel == 'email' || inputs.channel == 'both' || inputs.channel == ''
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          FROM_NAME: ${{ vars.FROM_NAME || 'Elena Brooks' }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL || 'elena.brooks@surplusdocket.com' }}
          REPLY_TO: ${{ vars.REPLY_TO || 'elena.brooks@surplusdocket.com' }}
          BATCH_LIMIT: ${{ inputs.limit || '12' }}
        run: |
          LIMIT="$BATCH_LIMIT"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "$GMAIL_APP_PASS" ]; then
            echo "Running in dry-run draft mode..."
            python outreach/generate_drafts.py --dry-run --limit="$LIMIT"
          else
            echo "Running live SMTP dispatch..."
            python outreach/generate_drafts.py --send --limit="$LIMIT"
          fi

      - name: Execute Form Outreach Batch (if selected)
        if: inputs.channel == 'forms' || inputs.channel == 'both'
        env:
          BATCH_LIMIT: ${{ inputs.limit || '12' }}
        run: |
          LIMIT="$BATCH_LIMIT"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python outreach/form_outreach_engine.py --dry-run --limit="$LIMIT"
          else
            python outreach/form_outreach_engine.py --limit="$LIMIT"
          fi

      - name: Commit & Push Updated Submission Logs & Manifests
        if: always() && github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: |
          git config --global user.name "Surplus Docket Outreach Bot"
          git config --global user.email "outreach@surplusdocket.com"
          for f in outreach/sent_log.csv outreach/drafts/_MANIFEST.csv outreach/form_submissions_log.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(outreach): recorded daily law firm outreach dispatches and drafts [skip ci]" && git pull --rebase origin main && git push)

      - name: Upload Screenshot & Draft Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outreach-artifacts
          path: |
            outreach/drafts/
            outreach/sent_log.csv
            outreach/form_screenshots/
            outreach/preview_artifacts/
          retention-days: 30

