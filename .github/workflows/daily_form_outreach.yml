name: Surplus Docket Targeted Legal Outreach Engine

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of law firms to contact per run (default: 12)'
        required: false
        default: '12'
      dry_run:
        description: 'Run in dry-run preview mode (no live submission/email send)'
        type: boolean
        default: true
      channel:
        description: 'Channel to execute: email (drafts & IMAP sync), forms (Playwright manual), or both'
        required: false
        default: 'email'
        type: choice
        options:
          - email
          - forms
          - both
      upload_drafts:
        description: 'Upload generated drafts to Gmail Drafts folder (dry-run only)'
        type: boolean
        default: false
      confirm_live_send:
        description: 'Type CONFIRM_LIVE to authorize live SMTP transmission (ignored in dry-run)'
        required: false
        default: ''

concurrency:
  group: outreach-production-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-outreach:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Headless Chromium (if forms channel selected)
        if: github.event_name == 'workflow_dispatch' && (inputs.channel == 'forms' || inputs.channel == 'both')
        run: |
          playwright install --with-deps chromium

      - name: Execute Legal Outreach & Draft Engine
        if: inputs.channel == 'email' || inputs.channel == 'both' || inputs.channel == ''
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'sandwichfitness@gmail.com' }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          FROM_NAME: ${{ vars.FROM_NAME || 'David Mahler' }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL || 'david@surplusdocket.com' }}
          REPLY_TO: ${{ vars.REPLY_TO || 'david@surplusdocket.com' }}
          BATCH_LIMIT: ${{ inputs.limit || '12' }}
        run: |
          LIMIT="$BATCH_LIMIT"
          # STRICT ZERO-SPAM POLICY: Automated runs NEVER dispatch live SMTP cold emails.
          # Live SMTP is strictly restricted to manual workflow_dispatch where dry_run is false AND confirm_live_send == 'CONFIRM_LIVE'.
          if [ "${{ github.event.inputs.dry_run }}" != "false" ] || [ "${{ github.event.inputs.confirm_live_send }}" != "CONFIRM_LIVE" ] || [ -z "$GMAIL_APP_PASS" ]; then
            if [ "${{ github.event.inputs.upload_drafts }}" = "true" ]; then
              echo "🛡️ Generating verified draft artifacts & syncing to Gmail Drafts..."
              python outreach/generate_drafts.py --dry-run --upload-drafts --limit="$LIMIT"
            else
              echo "🛡️ Generating verified draft artifacts locally without uploading..."
              python outreach/generate_drafts.py --dry-run --limit="$LIMIT"
            fi
          else
            echo "⚠️ Manual live SMTP dispatch explicitly authorized with confirmation..."
            python outreach/generate_drafts.py --send --limit="$LIMIT"
          fi

      - name: Execute Form Outreach Batch (if explicitly requested in workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && (inputs.channel == 'forms' || inputs.channel == 'both')
        env:
          BATCH_LIMIT: ${{ inputs.limit || '12' }}
        run: |
          LIMIT="$BATCH_LIMIT"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python outreach/form_outreach_engine.py --dry-run --limit="$LIMIT"
          else
            python outreach/form_outreach_engine.py --limit="$LIMIT" || {
              echo "⚠️ Batch completed with target status logging. Audit entries recorded to form_submissions_log.csv."
            }
          fi

      - name: Commit & Push Updated Submission Logs & Manifests
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.dry_run != true)
        run: |
          git config --global user.name "Surplus Docket Outreach Bot"
          git config --global user.email "outreach@surplusdocket.com"
          for f in outreach/sent_log.csv outreach/drafts/_MANIFEST.csv outreach/form_submissions_log.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore(outreach): recorded daily law firm outreach dispatches and drafts [skip ci]"
            git checkout -- . || true
            git clean -fd || true
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break || { echo "Retry push $attempt..."; sleep 5; }
            done
          fi

      - name: Upload Screenshot & Draft Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outreach-artifacts
          path: |
            outreach/drafts/
            outreach/sent_log.csv
            outreach/form_screenshots/
            outreach/preview_artifacts/
          retention-days: 30

